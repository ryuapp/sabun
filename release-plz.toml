[workspace]
# Ignore private workspace members by default. Only the Sabun application is a
# release target; support crates such as sabun-themes remain internal.
release = false

# Internal workspace crates must not inherit git-only version discovery. That
# lookup runs before release filtering and would associate them with Sabun's tag.
git_only = false
publish = false
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
git_release_type = "auto"
# Keep the release mutable while platform binaries are being attached. The
# workflow publishes it only after every build succeeds, at which point GitHub
# can safely make it immutable.
git_release_draft = true
git_release_latest = false

# Release only after a release-plz PR is merged.
release_always = false

# Keep dependency upgrades separate from release preparation.
dependencies_update = false

# Sabun is a binary crate, so API compatibility checks do not apply.
semver_check = false

[[package]]
name = "sabun"
release = true
# Sabun is distributed as an application, not through crates.io. Use Git tags as
# the source of truth for versions and create GitHub releases without publishing.
git_only = true

[changelog]
protect_breaking_commits = true
sort_commits = "oldest"
# Feature branches only need conventional commits. The release PR generates these entries and
# links the pull request associated with each commit when GitHub supplies one.
body = """
## [{{ version }}]\
    {%- if release_link -%}\
        ({{ release_link }})\
    {% endif %} \
    - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
          {% if commit.breaking %}[**breaking**] {% endif %}\
          {{ commit.message | upper_first }}\
          {%- if commit.remote.pr_number %} \
              ([#{{ commit.remote.pr_number }}]({{ remote.link }}/pull/{{ commit.remote.pr_number }}))\
          {% endif %}\
          {%- if commit.links %} \
              ({% for link in commit.links %}[{{ link.text }}]({{ link.href }}) {% endfor -%})\
          {% endif %}
    {% endfor -%}
{% endfor %}
"""
